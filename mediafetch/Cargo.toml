[package]
name = "mediafetch"
version = "0.1.0"
edition = "2021"
authors = ["directpass"]
description = "Blazing fast, human-readable terminal media fetcher built with Rust and Ratatui"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
id3 = "1.14"
dirs = "5.0"
unicode-width = "0.2"
regex = "1.10"
anyhow = "1.0"
