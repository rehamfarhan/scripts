[package]
name = "run"
version = "2.4.3"
edition = "2021"
authors = ["DirectPass"]
description = "Fast, nerdy-cool TUI game launcher & session tracker in Rust"

[dependencies]
ratatui = { version = "0.30", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.12", features = ["json"] }
fuzzy-matcher = "0.3"
walkdir = "2.5"
unicode-width = "0.2"
dirs = "6.0"
rand = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

